# compila la version web y la publica en github pages cada vez que se sube algo a main.
# en el repo hay que poner: settings > pages > source: github actions,
# y el secreto TMDB_API_KEY en settings > secrets and variables > actions.
name: web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # local.properties no esta en git: se crea aqui con la clave guardada como secreto
      - name: claves
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: echo "TMDB_API_KEY=$TMDB_API_KEY" > local.properties

      # dos versiones de la web: la de webassembly (rapida, para navegadores recientes) y la de
      # javascript (para iphones con ios anterior a 18.2, que no tienen wasm gc). index.html elige
      - name: compilar
        run: bash ./gradlew :webApp:wasmJsBrowserDistribution :webApp:jsBrowserDistribution

      - name: juntar
        run: |
          mkdir sitio
          cp -r webApp/build/dist/wasmJs/productionExecutable/. sitio/
          mkdir sitio/js
          cp -r webApp/build/dist/js/productionExecutable/. sitio/js/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - id: despliegue
        uses: actions/deploy-pages@v4
