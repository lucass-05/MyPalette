# compila el codigo de las ramas que no son main, sin publicar nada.
# sirve para comprobar que una rama compila antes de pasarla a main (que es lo que se publica).
name: compilar

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # escritorio (jvm) comprueba todo el codigo comun; web (wasm) sus partes propias
      - name: compilar
        run: bash ./gradlew :shared:compileKotlinJvm :shared:compileKotlinWasmJs --continue

      # capturas de las pantallas con datos de ejemplo, en movil y en ordenador, para revisarlas a ojo
      - name: capturas
        run: bash ./gradlew :shared:jvmTest --tests "*CapturasTest*"

      # las capturas tambien salen en el registro (en texto), para poder verlas sin descargar nada
      - name: capturas en el registro
        run: |
          cd shared/build/capturas
          for f in *.jpg; do
            echo "=====CAPTURA ${f%.jpg}"
            base64 -w 0 "$f"
            echo
          done
